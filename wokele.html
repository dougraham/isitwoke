        function displayData(data) {
            const table = document.getElementById("dataTable");

            tbody.innerHTML = '';

                    th.textContent = column;
                    headerRow.appendChild(th);
                });

                        td.textContent = cell;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            }
